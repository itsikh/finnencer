org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

# JVM — 6G heap + G1GC. The machine has 18G physical; with the Kotlin
# daemon (3G), an emulator and the IDE resident, 10G pushed the box
# ~15G into swap and R8 ran minutes slower from page-thrashing alone.
# 6G is comfortably enough for this app's R8 full-mode pass. Raise only
# if you see OutOfMemoryError, and re-check `sysctl vm.swapusage` after.
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Daemon + worker fan-out
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=11
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# Kotlin compiler + daemon
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseG1GC

# KSP
ksp.incremental=true
ksp.incremental.intermodule=true
# ksp.useKSP2=true — retest after upgrading Kotlin/KSP past 2.1.0-1.0.29;
# at this version KSP2 fails on Hilt/Room with "unexpected jvm signature V".
